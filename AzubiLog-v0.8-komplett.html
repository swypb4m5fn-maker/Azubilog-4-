<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>AzubiLog v0.8</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--blue:#2563eb;--blue2:#dbeafe;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:70px}body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab2c0;--blue2:#1e3a8a;--border:#374151}header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:21px}.logo{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#60a5fa);color:white;margin-right:9px}main{max-width:900px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-radius:20px;padding:20px}.hero h1{margin:0 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:10px 13px;font:inherit;font-weight:700}input,textarea,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font:inherit}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:13px 0}.stat,.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px}.stat b{display:block;font-size:22px}.meta{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;margin:13px 0}.toolbar>*{flex:1}.entry{margin:9px 0}.tag{display:inline-block;background:var(--blue2);color:var(--blue);padding:4px 8px;border-radius:999px;font-size:12px;margin-top:6px}.entry img{max-width:100%;max-height:380px;border-radius:12px;margin-top:9px}.ghost{background:var(--blue2);color:var(--blue)}.primary{background:#fff;color:#1d4ed8}.blue{background:var(--blue);color:#fff}.danger{background:#fee2e2;color:#dc2626}.small{padding:7px 9px;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:8}nav button{flex:1;background:transparent;color:var(--muted)}.version{position:fixed;left:9px;bottom:66px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted);z-index:9;box-shadow:0 3px 12px #0002}.version i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;margin-right:5px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:12px;overflow:auto}.modal.open{display:block}.sheet{max-width:700px;margin:15px auto;background:var(--card);border-radius:19px;padding:17px}.close{float:right;background:none;font-size:24px;padding:0}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{flex-wrap:wrap}.toolbar>*{min-width:140px}.version{bottom:62px}}
</style></head><body>
<header><div class="brand"><span class="logo">🎙️</span>AzubiLog <span class="meta">Digitales Ausbildungs-Tagebuch</span></div></header>
<main><section class="hero"><h1>Dein Ausbildungs-Tagebuch</h1><p>Sprechen, dokumentieren, wiederfinden und Wissen aufbauen.</p><div class="actions"><button class="primary" id="voice">🎤 Eintrag sprechen</button><button class="primary" id="new">✏️ Eintrag schreiben</button></div></section>
<div class="stats"><div class="stat"><b id="count">0</b><span>Einträge</span></div><div class="stat"><b id="imp">0</b><span>⭐ Wichtig</span></div><div class="stat"><b id="learn">0</b><span>💡 Gelernt</span></div><div class="stat"><b id="streak">0</b><span>🔥 Serie</span></div></div>
<div class="toolbar"><input id="search" placeholder="🔎 Suchen..."><select id="filter"><option value="">Alle Kategorien</option><option>Praxis</option><option>Berufsschule</option><option>Software</option><option>Werkzeuge</option><option>Kundenkontakt</option><option>Gelernt</option><option>Fragen</option><option>Wichtig</option></select><button class="ghost" id="cal">📅 Kalender</button></div>
<section id="list"></section>
<div class="card"><h3>🧰 Mehr</h3><div class="actions"><button class="ghost" id="projects">📁 Projekte</button><button class="ghost" id="questions">❓ Fragen</button><button class="ghost" id="knowledge">💡 Wissen</button><button class="ghost" id="backup">📤 Backup</button><button class="ghost" id="restore">📥 Wiederherstellen</button><button class="ghost" id="dark">🌙 Design</button><button class="ghost" id="overview">📄 Übersicht</button></div></div></main>
<div class="version"><i></i>AzubiLog v0.8</div><nav><button onclick="scrollTo({top:0,behavior:'smooth'})">🏠 Start</button><button id="navcal">📅 Kalender</button><button onclick="search.focus()">🔎 Suche</button><button onclick="scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">⚙️ Mehr</button></nav>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><h2 id="mt">Neuer Eintrag</h2><form id="form"><input type="hidden" id="eid"><label>Datum<input type="date" id="date" required></label><label>Titel<input id="title" required></label><label>Beschreibung<textarea id="desc"></textarea></label><label>Was habe ich gelernt?<textarea id="learned"></textarea></label><label>Kategorie<select id="cat"><option>Praxis</option><option>Berufsschule</option><option>Software</option><option>Werkzeuge</option><option>Kundenkontakt</option><option>Gelernt</option><option>Fragen</option><option>Wichtig</option></select></label><label>Projekt<input id="project"></label><label>Foto<input type="file" id="photo" accept="image/*" capture="environment"></label><div id="preview"></div><div class="actions"><button class="blue">💾 Speichern</button><button type="button" class="ghost" id="cancel">Abbrechen</button></div></form></div></div>
<div class="modal" id="info"><div class="sheet"><button class="close" onclick="info.classList.remove('open')">×</button><h2 id="it"></h2><div id="ic"></div></div></div>
<script>
const KEY="azubiLogV10";let entries=JSON.parse(localStorage.getItem(KEY)||"[]"),$=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);date.value=today();
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(entries));render()}
function openForm(e=null,text=""){modal.classList.add("open");mt.textContent=e?"Eintrag bearbeiten":"Neuer Eintrag";eid.value=e?.id||"";date.value=e?.date||today();title.value=e?.title||"";desc.value=e?.description||text;learned.value=e?.learned||"";cat.value=e?.category||"Praxis";project.value=e?.project||"";photo.value="";preview.innerHTML=e?.photo?`<img src="${e.photo}">`:""}
new.onclick=()=>openForm();close.onclick=cancel.onclick=()=>modal.classList.remove("open");
form.onsubmit=async e=>{e.preventDefault();let id=eid.value||Date.now().toString(),old=entries.find(x=>x.id===id),p=old?.photo||"";if(photo.files[0])p=await new Promise(r=>{let f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(photo.files[0])});let x={id,date:date.value,title:title.value.trim(),description:desc.value.trim(),learned:learned.value.trim(),category:cat.value,project:project.value.trim(),photo:p,important:old?.important||false};let i=entries.findIndex(x=>x.id===id);i<0?entries.unshift(x):entries[i]=x;save();modal.classList.remove("open")};
function render(){let q=search.value.toLowerCase(),c=filter.value,a=entries.filter(e=>(!c||e.category===c)&&(!q||[e.title,e.description,e.learned,e.category,e.project].join(" ").toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));count.textContent=entries.length;imp.textContent=entries.filter(e=>e.important).length;learn.textContent=entries.filter(e=>e.learned).length;streak.textContent=streakCalc();list.innerHTML=a.length?a.map(e=>`<article class="card entry"><h3>${e.important?"⭐ ":""}${esc(e.title)}</h3><div class="meta">${esc(e.date)}${e.project?" · 📁 "+esc(e.project):""}</div><span class="tag">${esc(e.category)}</span>${e.description?`<p>${esc(e.description)}</p>`:""}${e.learned?`<p>💡 <b>Gelernt:</b> ${esc(e.learned)}</p>`:""}${e.photo?`<img src="${e.photo}">`:""}<div class="actions"><button class="ghost small" onclick="toggle('${e.id}')">⭐ ${e.important?"Nicht wichtig":"Wichtig"}</button><button class="ghost small" onclick="edit('${e.id}')">✏️ Bearbeiten</button><button class="danger small" onclick="del('${e.id}')">🗑️ Löschen</button></div></article>`).join(""):'<div class="card" style="text-align:center;color:var(--muted);padding:30px">Noch keine passenden Einträge.</div>'}
function toggle(id){let e=entries.find(x=>x.id===id);e.important=!e.important;save()}function edit(id){openForm(entries.find(x=>x.id===id))}function del(id){if(confirm("Diesen Eintrag wirklich löschen?")){entries=entries.filter(x=>x.id!==id);save()}}function streakCalc(){let d=[...new Set(entries.map(e=>e.date))].sort().reverse();if(!d.length)return 0;let n=0,start=new Date(d[0]);for(let i=0;i<d.length;i++){let x=new Date(start);x.setDate(start.getDate()-i);if(d[i]!==x.toISOString().slice(0,10))break;n++}return n}
search.oninput=render;filter.onchange=render;
function show(t,c){it.textContent=t;ic.innerHTML=c;info.classList.add("open")}
function calShow(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7,h=`<p><b>${d.toLocaleString("de-DE",{month:"long",year:"numeric"})}</b></p><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">`;for(let i=0;i<first;i++)h+="<div></div>";for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,has=entries.some(e=>e.date===ds);h+=`<div class="card" style="padding:8px;min-height:45px;${has?"outline:2px solid var(--blue)":""}">${n}${has?" 📝":""}</div>`}show("📅 Kalender",h+"</div>")}
cal.onclick=navcal.onclick=calShow;
projects.onclick=()=>{let p={};entries.forEach(e=>{if(e.project)(p[e.project]??=[]).push(e)});show("📁 Projekte",Object.keys(p).length?Object.entries(p).map(([k,v])=>`<div class="card"><b>${esc(k)}</b><div class="meta">${v.length} Einträge</div></div>`).join(""):"Noch keine Projekte.")};
questions.onclick=()=>{let q=entries.filter(e=>e.category==="Fragen"||e.title.includes("?")||e.description.includes("?"));show("❓ Fragen",q.length?q.map(e=>`<div class="card"><b>${esc(e.title)}</b><p>${esc(e.description)}</p></div>`).join(""):"Keine Fragen gefunden.")};
knowledge.onclick=()=>{let q=entries.filter(e=>e.learned);show("💡 Wissen",q.length?q.map(e=>`<div class="card"><b>${esc(e.title)}</b><p>${esc(e.learned)}</p></div>`).join(""):"Noch keine Lernnotizen.")};
dark.onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("azubiDark",document.body.classList.contains("dark")?"1":"0")};if(localStorage.getItem("azubiDark")==="1")document.body.classList.add("dark");
backup.onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(entries,null,2)],{type:"application/json"}));a.download="AzubiLog-Backup.json";a.click()};
restore.onclick=()=>{let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{entries=JSON.parse(r.result);save();alert("Backup wiederhergestellt.")}catch{alert("Ungültiges Backup.")}};r.readAsText(i.files[0])};i.click()};
overview.onclick=()=>{let s="AzubiLog – Ausbildungsübersicht\n\n";entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>s+=`${e.date} – ${e.title}\nKategorie: ${e.category}\n${e.description}\nGelernt: ${e.learned}\n\n`);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/plain"}));a.download="AzubiLog-Ausbildungsuebersicht.txt";a.click()};
voice.onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Spracherkennung wird in diesem Browser nicht unterstützt.");return}let r=new SR();r.lang="de-DE";r.onstart=()=>voice.textContent="🎙️ Ich höre zu…";r.onresult=e=>{let t=e.results[0][0].transcript;openForm(null,t);title.value=t.split(" ").slice(0,7).join(" ")};r.onerror=()=>alert("Spracheingabe konnte nicht gestartet werden.");r.onend=()=>voice.textContent="🎤 Eintrag sprechen";r.start()};
render();
</script></body></html>
