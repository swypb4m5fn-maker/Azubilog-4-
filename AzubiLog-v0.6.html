<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AzubiLog</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.app{max-width:800px;margin:auto;padding:20px}.hero{background:#2563eb;color:white;border-radius:24px;padding:28px;text-align:center}.mic{font-size:42px;width:90px;height:90px;border:0;border-radius:50%;background:white}.card{background:white;padding:16px;margin:12px 0;border-radius:16px}button{padding:10px;border:0;border-radius:10px;cursor:pointer}.stats{display:flex;gap:10px;margin:15px 0}.stat{flex:1;text-align:center}.search{width:100%;padding:13px;box-sizing:border-box;margin:15px 0;border:1px solid #ddd;border-radius:12px}input,textarea,select{width:100%;padding:12px;box-sizing:border-box;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.box{background:white;padding:22px;border-radius:20px;width:min(560px,90%)}.show{display:flex}.save{background:#2563eb;color:white;width:100%}</style></head><body><div class="app"><h1>📘 AzubiLog</h1><p>Sprechen. Speichern. Weiterkommen.</p><section class="hero"><h2>Dein Ausbildungstag</h2><p>Dokumentiere schnell, was du gemacht und gelernt hast.</p><button class="mic" id="mic">🎤</button><p id="status">Tippen und sprechen</p><button onclick="openModal()">✏️ Eintrag manuell</button></section><div class="stats"><div class="card stat"><b id="count">0</b><br>Einträge</div><div class="card stat"><b id="imp">0</b><br>Wichtig</div><div class="card stat"><b id="learn">0</b><br>Gelernt</div></div><input class="search" id="search" placeholder="🔎 Einträge durchsuchen"><div id="entries"></div></div><div class="modal" id="modal"><div class="box"><button onclick="closeModal()">✕</button><h2>Neuer Eintrag</h2><label>Titel</label><input id="title"><label>Was hast du gemacht?</label><textarea id="desc"></textarea><label>Was hast du gelernt?</label><textarea id="learned"></textarea><label>Kategorie</label><select id="cat"><option>Praxis</option><option>Berufsschule</option><option>Software</option><option>Werkzeuge</option><option>Kundenkontakt</option><option>Gelernt</option><option>Fragen</option><option>Wichtig</option></select><label>Datum</label><input id="date" type="date"><button class="save" onclick="save()">💾 Speichern</button></div></div><script>let es=JSON.parse(localStorage.azubiLog||'[]');const $=id=>document.getElementById(id);function render(){let q=$('search').value.toLowerCase();let a=es.filter(e=>(e.title+' '+e.desc+' '+e.learned).toLowerCase().includes(q));$('entries').innerHTML=a.length?a.map(e=>`<div class="card"><small>${e.date} · ${e.cat}</small><h3>${e.imp?'⭐ ':''}${esc(e.title||'Ohne Titel')}</h3><p>${esc(e.desc)}</p>${e.learned?'<p>💡 '+esc(e.learned)+'</p>':''}<button onclick="imp('${e.id}')">⭐ Wichtig</button> <button onclick="del('${e.id}')">🗑️ Löschen</button></div>`).join(''):'<div class="card">Noch keine passenden Einträge.</div>';$('count').textContent=es.length;$('imp').textContent=es.filter(e=>e.imp).length;$('learn').textContent=es.filter(e=>e.learned).length}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openModal(t=''){ $('modal').classList.add('show');$('date').value=new Date().toISOString().slice(0,10);$('desc').value=t;$('title').value=t.split(/\s+/).slice(0,6).join(' ')}function closeModal(){$('modal').classList.remove('show')}function save(){if(!$('desc').value.trim())return alert('Bitte etwas eintragen.');es.push({id:Date.now(),title:$('title').value,desc:$('desc').value,learned:$('learned').value,cat:$('cat').value,date:$('date').value,imp:false});localStorage.azubiLog=JSON.stringify(es);closeModal();['title','desc','learned'].forEach(x=>$(x).value='');render()}function imp(id){let e=es.find(x=>x.id==id);e.imp=!e.imp;localStorage.azubiLog=JSON.stringify(es);render()}function del(id){if(confirm('Eintrag löschen?')){es=es.filter(x=>x.id!=id);localStorage.azubiLog=JSON.stringify(es);render()}}$('search').oninput=render;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR;r.lang='de-DE';$('mic').onclick=()=>r.start();r.onstart=()=>$('status').textContent='Ich höre zu …';r.onend=()=>$('status').textContent='Tippen und sprechen';r.onresult=e=>openModal(e.results[0][0].transcript)}else $('mic').onclick=()=>alert('Spracheingabe wird von diesem Browser nicht unterstützt.');render();</script></body></html>
